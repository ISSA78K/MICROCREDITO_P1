services:
  db:
    image: pgvector/pgvector:pg16
    container_name: microcredito_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: microcredito_final
      POSTGRES_USER: microcredito_app
      POSTGRES_PASSWORD: MicrocreditoLocal_2026!
    ports:
      - "5433:5432"
    volumes:
      - microcredito_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microcredito_app -d microcredito_final"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  microcredito_data: